  # ── Greenhouse board — India ML/AI (API-backed, very fast) ───────────
  - name: Greenhouse India — ML Engineer
    query: 'site:job-boards.greenhouse.io "Machine Learning" OR "AI Engineer" OR "LLM" bangalore OR chennai OR hyderabad OR mumbai OR india'
    enabled: true

