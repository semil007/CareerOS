# Portal Scanner — Semil Periyasamy
# Target: ML Engineer, AI Engineer, GPU/Inference, ML Infrastructure
# Location: India — Bangalore, Chennai, Hyderabad, Mumbai, Pune, Delhi + Remote
# Coverage: 120+ companies across Greenhouse, Ashby, Lever, Workable, BambooHR,
#           SmartRecruiters, Workday, Teamtailor, Recruitee, Himalayas, RemoteOK, Remotive
#
# NOTE on Instahyre: Closed marketplace (invite/profile-based, no public API).
# To get on it: upload your profile at instahyre.com — recruiters come to you.
# It integrates with Lever/Greenhouse/Freshteam but doesn't expose a job feed.

title_filter:
  positive:
    # Core ML/AI engineering titles
    - "Machine Learning"
    - "ML Engineer"
    - "AI Engineer"
    - "AI/ML"                   # catches "Senior AI/ML Engineer"
    - "Applied AI"
    - "Applied ML"
    # LLM / GenAI
    - "LLM"
    - "LLMOps"
    - "LLMops"                  # case variant
    # MLOps / Infra
    - "MLOps"
    - "ML Platform"
    - "AI Platform"
    - "ML Infrastructure"
    - "ML Infra"
    - "Inference Engineer"
    - "Inference"               # catches "GPU Inference Engineer"
    # Deep learning / Vision / NLP
    - "Deep Learning"
    - "NLP Engineer"
    - "NLP"
    - "Computer Vision"
    - "Vision Engineer"
    # GenAI
    - "Generative AI"
    - "GenAI"
    # Research
    - "Research Engineer"
    - "AI Research"
    - "ML Research"
    - "Research Scientist"
    # Data Science (some India companies post ML work under this title)
    - "Data Scientist"
    - "ML Scientist"
    # Agentic / RAG
    - "Agentic"
    - "RAG Engineer"
    # Founding / Staff AI roles (common at AI-first startups)
    - "Founding Engineer"           # catches "Founding Engineer (AI)", "Founding AI Engineer"
    - "AI Software Engineer"        # catches "Senior AI Software Engineer"
    - "Software Engineer, AI"       # catches "Software Engineer, AI/ML"
    - "Software Engineer - AI"      # dash variant
    - "Software Engineer (AI"       # paren variant
    - "AI Product Engineer"
    - "Prompt Engineer"
    - "AI Agent"                    # catches "AI Agent Engineer", "AI Agents Platform"
  negative:
    - "Intern"
    - "Junior"
    - "Data Analyst"
    - "Business Analyst"
    - "Salesforce"
    - "SAP "
    - "Java "
    - "iOS"
    - "Android"
    - "PHP"
    - "Blockchain"
    - "Web3"
    - "Trainee"
    - "Fresher"
    - "Vice President"
    - "Director of"
    - "Marketing"
    - "Sales Engineer"
    - "Account Manager"
  seniority_boost:
    - "Senior"
    - "Staff"
    - "Lead"
    - "Principal"
    - "SDE-2"
    - "SDE2"
    - "L4"
    - "L5"
    - "MTS"                    # Member of Technical Staff (common in India MNCs)

location_filter:
  always_allow:
    - "remote"
    - "work from home"
    - "wfh"
    - "anywhere"
    - "worldwide"
    - "global"
    - "hybrid"
  allow:
    - "india"
    - "bangalore"
    - "bengaluru"
    - "chennai"
    - "hyderabad"
    - "mumbai"
    - "pune"
    - "delhi"
    - "noida"
    - "gurugram"
    - "gurgaon"
    - "coimbatore"
    - "kolkata"
    - "kochi"
    - "ahmedabad"
    - "jaipur"
    - "indore"
    - "remote"
  block:
    - "united states only"
    - "us only"
    - "uk only"
    - "london only"
    - "berlin only"
    - "paris only"
    - "no remote"
    - "on-site only"
    - "toronto only"
    - "sydney only"

content_filter:
  positive:
    - "pytorch"
    - "llm"
    - "rag"
    - "inference"
    - "gpu"
    - "cuda"
    - "vllm"
    - "mlops"
    - "fine-tun"
    - "generative"
    - "agent"
    - "transformer"
    - "hugging face"
    - "langchain"
    - "tensorflow"
    - "deep learning"
  negative:
    - "wordpress"
    - "salesforce admin"
    - "sharepoint"
    - "power bi only"

