# Portal Scanner — Semil Periyasamy
# Target: ML Engineer, AI Engineer, GPU/Inference, ML Infrastructure
# Location: India — Bangalore, Chennai, Hyderabad, Mumbai, Pune, Delhi + Remote
# Coverage: 120+ companies across Greenhouse, Ashby, Lever, Workable, BambooHR,
#           SmartRecruiters, Workday, Teamtailor, Recruitee, Himalayas, RemoteOK, Remotive
#
# NOTE on Instahyre: Closed marketplace (invite/profile-based, no public API).
# To get on it: upload your profile at instahyre.com — recruiters come to you.
# It integrates with Lever/Greenhouse/Freshteam but doesn't expose a job feed.

title_filter:
  positive:
    # Core ML/AI engineering titles
    - "Machine Learning"
    - "ML Engineer"
    - "AI Engineer"
    - "AI/ML"                   # catches "Senior AI/ML Engineer"
    - "Applied AI"
    - "Applied ML"
    # LLM / GenAI
    - "LLM"
    - "LLMOps"
    - "LLMops"                  # case variant
    # MLOps / Infra
    - "MLOps"
    - "ML Platform"
    - "AI Platform"
    - "ML Infrastructure"
    - "ML Infra"
    - "Inference Engineer"
    - "Inference"               # catches "GPU Inference Engineer"
    # Deep learning / Vision / NLP
    - "Deep Learning"
    - "NLP Engineer"
    - "NLP"
    - "Computer Vision"
    - "Vision Engineer"
    # GenAI
    - "Generative AI"
    - "GenAI"
    # Research
    - "Research Engineer"
    - "AI Research"
    - "ML Research"
    - "Research Scientist"
    # Data Science (some India companies post ML work under this title)
    - "Data Scientist"
    - "ML Scientist"
    # Agentic / RAG
    - "Agentic"
    - "RAG Engineer"
    # Founding / Staff AI roles (common at AI-first startups)
    - "Founding Engineer"           # catches "Founding Engineer (AI)", "Founding AI Engineer"
    - "AI Software Engineer"        # catches "Senior AI Software Engineer"
    - "Software Engineer, AI"       # catches "Software Engineer, AI/ML"
    - "Software Engineer - AI"      # dash variant
    - "Software Engineer (AI"       # paren variant
    - "AI Product Engineer"
    - "Prompt Engineer"
    - "AI Agent"                    # catches "AI Agent Engineer", "AI Agents Platform"
    # Junior / entry-level ML titles
    - "Junior ML"
    - "Junior AI"
    - "Junior Machine Learning"
    - "Entry Level ML"
    - "Entry Level AI"
    - "Associate ML"
    - "Associate AI"
    - "SDE-1"                        # Software Dev Engineer L1
    - "SDE1"
    - "L3"                           # Grad-hire level at many India cos
    - "Graduate Engineer"            # many India MNCs post grad-level ML roles
    - "Data Engineer"                # Data engineering has heavy ML overlap in India
    - "ML Ops"                       # space variant of MLOps
    - "AI Ops"                       # space variant of AIOps
    - "AI Developer"                 # common alternate title for junior AI engineers
  negative:
    - "Intern"
    - "Data Analyst"
    - "Business Analyst"
    - "Salesforce"
    - "SAP "
    - "Java "
    - "iOS"
    - "Android"
    - "PHP"
    - "Blockchain"
    - "Web3"
    - "Trainee"
    - "Fresher"
    - "Vice President"
    - "Director of"
    - "Marketing"
    - "Sales Engineer"
    - "Account Manager"
  seniority_boost:
    - "Senior"
    - "Staff"
    - "Lead"
    - "Principal"
    - "SDE-2"
    - "SDE2"
    - "L4"
    - "L5"
    - "MTS"                    # Member of Technical Staff (common in India MNCs)

location_filter:
  always_allow:
    - "remote"
    - "work from home"
    - "wfh"
    - "anywhere"
    - "worldwide"
    - "global"
    - "hybrid"
  allow:
    - "india"
    - "bangalore"
    - "bengaluru"
    - "chennai"
    - "hyderabad"
    - "mumbai"
    - "pune"
    - "delhi"
    - "noida"
    - "gurugram"
    - "gurgaon"
    - "coimbatore"
    - "kolkata"
    - "kochi"
    - "ahmedabad"
    - "jaipur"
    - "indore"
    - "remote"
  block:
    - "united states only"
    - "us only"
    - "uk only"
    - "london only"
    - "berlin only"
    - "paris only"
    - "no remote"
    - "on-site only"
    - "toronto only"
    - "sydney only"

# Annualized INR range (6 LPA – 25 LPA).
# Jobs with NO salary data still PASS (conservative — most Indian ATS don't
# expose salary in the API payload, so we never want to silently drop them).
# Only drops a job when BOTH bounds are known and the job is entirely outside
# the range.

# Quick reference:
#   6 LPA  = 600000 INR / year
#   10 LPA = 1000000 INR / year
#   25 LPA = 2500000 INR / year


# To disable salary filtering: set both min and max to 0.
# Salary filter — DISABLED (user wants all roles regardless of comp).
# Set min: 0 and max: 0 to pass all jobs through.
salary_filter:
  min: 0            # 0 = no minimum — junior/entry roles included
  max: 0            # 0 = no maximum — no ceiling either
  currency: INR

content_filter:
  # NOTE: content_filter is applied conservatively — if a job has NO content
  # field in the ATS API (very common), it PASSES regardless of these lists.
  # Only drops jobs when content IS available AND it matches a negative keyword.
  # The positive list is intentionally broad — just needs ONE keyword present.
  positive:
    - "machine learning"
    - "deep learning"
    - "pytorch"
    - "tensorflow"
    - "llm"
    - "rag"
    - "inference"
    - "gpu"
    - "cuda"
    - "vllm"
    - "mlops"
    - "fine-tun"
    - "generative"
    - "agent"
    - "transformer"
    - "hugging face"
    - "langchain"
    - "scikit"
    - "keras"
    - "neural network"
    - "natural language"
    - "computer vision"
    - "image recognition"
    - "recommendation"
    - "classification"
    - "regression"
    - "nlp"
    - "bert"
    - "gpt"
    - "model training"
    - "model deployment"
    - "data science"
    - "feature engineering"
    - "ml pipeline"
    - "ai model"
  negative:
    - "wordpress"
    - "salesforce admin"
    - "sharepoint"
    - "power bi only"

